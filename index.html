<!DOCTYPE html>
<html lang="ko" data-v="h">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Scent</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--ln:#3b3b3b;--mut:#a3a3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-v="d"]{--bg:#fff;--fg:#0a0a0a;--ln:#d2d2d2;--mut:#777}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:11px/1.8 'Space Mono','Noto Sans KR',monospace}
button{font:inherit;color:inherit}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;background:#000;color:#fff;padding:9px 14px;font:11px 'Archivo Black',sans-serif}
.hd button{all:unset;cursor:pointer;margin-left:16px}.hd button:first-child{margin:0}
main{max-width:1100px;margin:0 auto;padding:0 14px 48px}main[hidden]{display:none}
.tt{font:400 12vw/.95 'Archivo Black',sans-serif;letter-spacing:-.03em;text-align:center;margin:26px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--fg)}
.tg{font:14px/1.4 'Archivo Black','Noto Sans KR',sans-serif;text-align:center;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:center;padding:26px 12px 20px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.cell svg{width:80%;max-width:230px;margin-bottom:14px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cell:hover svg,.cell:focus-visible svg{transform:rotate(24deg) scale(1.06)}
.cell small,.pc small{display:block;font-size:10px;line-height:1.6}
.hero{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln)}
.hero>div{padding:20px}.im{border-right:1px solid var(--ln);display:grid;place-items:center}
.hero p{margin:0 0 8px}.ds{margin-top:14px!important;line-height:1.9}
.btn{display:block;width:100%;margin-top:18px;padding:12px;border:0;background:#000;color:#fff;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#444}
.bar{border:1px solid var(--ln);border-top:0;text-align:center;padding:12px;font:14px 'Archivo Black',sans-serif}
.dbs{text-align:center;font-size:9px;letter-spacing:.03em;color:var(--mut);border:1px solid var(--ln);border-top:0;padding:4px;background:var(--bg)}
#authModal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#authModal[hidden]{display:none}
.am-card{position:relative;width:100%;max-width:320px;background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:26px 20px 20px}
.am-card h2{font:400 20px 'Archivo Black',sans-serif;margin:0 0 18px;letter-spacing:-.01em}
#amClose{all:unset;position:absolute;top:14px;right:16px;cursor:pointer;font-size:13px}
.am-card label{display:block;font-size:10px;color:var(--mut);margin:0 0 14px;letter-spacing:.03em}
.am-card input{display:block;width:100%;margin-top:5px;padding:9px 8px;background:transparent;border:1px solid var(--ln);color:var(--fg);font:12px 'Space Mono',monospace}
.am-card input:focus-visible{outline:1px solid var(--fg)}
.am-msg{font-size:10px;line-height:1.6;margin:-6px 0 14px}
.am-switch{all:unset;display:block;width:100%;text-align:center;margin-top:14px;font-size:10px;color:var(--mut);cursor:pointer;text-decoration:underline}
.hd button[hidden]{display:none}
.btn.o{background:transparent;color:var(--fg);border:1px solid var(--fg);margin-top:8px}
.btn.o:hover{background:var(--fg);color:var(--bg)}
.hdb{text-align:center;font-size:9px;color:var(--mut);margin-top:10px}
.prods{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;border:1px solid var(--ln);border-top:0;scroll-snap-type:x mandatory}
.pc{all:unset;box-sizing:border-box;display:block;cursor:default;text-align:center;padding:22px 10px;border-right:1px solid var(--ln);scroll-snap-align:start}
button.pc{cursor:pointer}
.pc svg{width:64px;height:90px;margin-bottom:12px;transition:transform .4s}.pc:hover svg{transform:rotate(-8deg) scale(1.08)}
button.pc svg{width:70px;height:70px}
.epk{margin-top:64px}
.ol{font:400 12vw/1 'Archivo Black',sans-serif;color:transparent;-webkit-text-stroke:1.5px var(--fg);letter-spacing:-.03em;text-align:center;margin:0 0 20px}
.lb{display:block;font-size:10px;color:var(--mut);margin:0 0 6px}
.ab p{max-width:46ch;margin:0}
.row{display:grid;grid-template-columns:42% 1fr;gap:6%;margin-top:32px}
.cdc{position:relative}
.cdw{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1px var(--ln)}
.cd{position:absolute;inset:0;border-radius:50%;overflow:hidden}.cd svg{width:100%;height:100%;display:block}
.sh{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 30deg,transparent 0 18%,rgba(255,255,255,.55) 24%,transparent 30% 68%,rgba(255,255,255,.4) 74%,transparent 80%)}
.hole{position:absolute;inset:38%;border-radius:50%;background:var(--bg);box-shadow:0 0 0 7px rgba(255,255,255,.6),0 0 0 8px var(--ln)}
.tl{margin:0 0 22px;border-top:1px solid var(--ln)}
.tl .tr{display:flex;align-items:stretch;border-bottom:1px solid var(--ln)}
.tl .rowbtn{all:unset;box-sizing:border-box;flex:1;min-width:0;display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;cursor:pointer;transition:padding .2s,background .2s}
.tl .rowbtn:hover,.tl .rowbtn.on{padding-left:8px;background:var(--fg);color:var(--bg)}
.tl .rowbtn.on b::before{content:"▸ "}
.tl b{font-weight:400}.tl em{display:block;font-style:normal;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .rowbtn:hover em,.tl .rowbtn.on em{color:inherit;opacity:.7}
.tl .ext{all:unset;box-sizing:border-box;flex:none;width:30px;display:grid;place-items:center;cursor:pointer;color:var(--mut);text-decoration:none}
.tl .ext:hover{color:var(--fg)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--fg);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#player[hidden]{display:none}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;max-width:480px;margin:0 auto 8px}
.p-top div{min-width:0}
.p-top b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top em{font-style:normal;color:var(--mut);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pClose{all:unset;cursor:pointer;font-size:14px;flex:none;padding:2px 4px}
.p-frame{width:100%;max-width:480px;margin:0 auto;aspect-ratio:16/9;background:#000}
.p-frame iframe{width:100%;height:100%;border:0;display:block}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:22px;max-width:480px;margin:8px auto 0;font:12px 'Archivo Black',sans-serif}
.p-ctrl button{all:unset;cursor:pointer;font-size:16px}
.p-ctrl a{color:inherit;text-decoration:none;font:11px 'Space Mono',monospace;border:1px solid var(--ln);padding:5px 10px}
.p-ctrl a:hover{background:var(--fg);color:var(--bg)}
.ph{margin:24px 0 0}.ph svg{display:block;width:100%;aspect-ratio:4/3}
figcaption{font-size:9px;color:var(--mut);margin-top:6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:6%;margin:40px 0}
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:48px}
.gal figure{width:calc(25% - 9px);margin:0}.gal svg{display:block;width:100%;aspect-ratio:1}.gal figcaption{text-align:center}
.tape{max-width:420px;margin:16px auto 0}.tape svg{display:block;width:100%}
.reel{transform-box:fill-box;transform-origin:center}
.ls{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ln);margin-top:28px}
.ls a{padding:16px 8px;text-align:center;color:inherit;text-decoration:none;border-right:1px solid var(--ln);transition:background .2s,color .2s}
.ls a:last-child{border:0}.ls a:hover{background:var(--fg);color:var(--bg)}
.abt{position:relative;text-align:center;max-width:720px;margin:0 auto;padding:70px 20px 40px;font:900 clamp(17px,4.4vw,28px)/1.3 'Archivo Black','Noto Sans KR',sans-serif}
.abt p{margin:0 0 1.4em}.fc{position:absolute;width:64px;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(14deg)}}
footer{max-width:1100px;margin:0 auto;padding:0 14px 28px;text-align:center}
.mb{font:12px 'Archivo Black',sans-serif;margin:40px 0 24px;padding-top:24px;border-top:1px solid var(--ln)}
.big a{display:block;font:400 min(11vw,110px)/1.02 'Archivo Black',sans-serif;color:inherit;text-decoration:none;letter-spacing:-.02em;transition:opacity .2s}
.big a:hover{opacity:.45}
.fb{display:flex;justify-content:space-between;margin-top:56px;font:12px 'Archivo Black',sans-serif}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ---- JWT 만료 처리 + 로그인 사용자 전용 요청 ----
let FAVS=new Set(),FAVLIST=[],refreshP=null;
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
function refreshSession(){
  if(!authRefresh)return Promise.resolve(false);
  return refreshP=refreshP||(async()=>{
    try{
      const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{...SB_HEAD,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authRefresh})});
      if(!r.ok)return false;
      saveSession(await r.json());return true;
    }catch(e){return false}finally{refreshP=null}
  })();
}
async function authedFetch(path,opt={}){
  if(!authToken)return new Response(null,{status:401});
  if(jwtExp(authToken)<Date.now()+30000)await refreshSession();
  const run=()=>fetch(SB_URL+path,{...opt,headers:{...SB_HEAD,'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+authToken}});
  let r=await run();
  if(r.status===401&&await refreshSession())r=await run();
  if(r.status===401){clearSession();FAVS=new Set();FAVLIST=[];updateFavBtn();openAuth('login','로그인이 만료되었어요. 다시 로그인해 주세요')}
  return r;
}

loadSession();renderAuthBtn();authRedirect();if(authUser)loadFavs();
$('#amForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#amEmail').value.trim(),pass=$('#amPass').value;
  const btn=$('#amSubmit'),msg=$('#amErr');
  btn.disabled=true;msg.hidden=true;
  try{await submitAuth(email,pass)}
  catch(err){msg.textContent=err.message;msg.style.color=err.bad===false?'var(--fg)':'#d5405f';msg.hidden=false}
  btn.disabled=false;
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#authBtn'))return authUser?doLogout():openAuth('login');
  if(t.closest('#myBtn'))return showMy();
  const fb=t.closest('#favBtn');if(fb)return toggleFav(fb.dataset.k);
  if(t.closest('#amClose'))return closeAuth();
  if(t.closest('#amSwitch'))return openAuth(authMode==='login'?'signup':'login');
  if(t.closest('#authModal')&&!t.closest('.am-card'))return closeAuth();
  const i=t.closest('[data-i]');
  if(i)return go(+i.dataset.i);
  if(t.closest('#hm'))return show('h');
  if(t.closest('#ab'))return show('a');
  if(t.closest('#ct'))return $('footer').scrollIntoView({behavior:'smooth'});
  if(t.closest('#go'))return $('.epk').scrollIntoView({behavior:'smooth'});
  if(t.closest('#pClose'))return closePlayer();
  if(t.closest('#pPrev'))return step(-1);
  if(t.closest('#pNext'))return step(1);
  const r=t.closest('.rowbtn');
  if(r)return openPlayer(+r.dataset.scent,+r.dataset.idx,r.dataset.title,r.dataset.artist);
});
</script>
</body>
</html>
